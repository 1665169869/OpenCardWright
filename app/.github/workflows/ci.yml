name: ci

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['app/**']

defaults:
  run:
    working-directory: app

jobs:
  windows:
    # 必须在 Windows 上跑：csc.exe 只有 Windows 版，Tauri 的 MSVC 目标也只有 Windows 能验
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 门禁 1：编译 ../sdk 并跑 46 项自检（纯字节，不需要硬件）
      - name: Build SDK + selftest gate
        run: pnpm build:sdk

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # 门禁 2：解析器、存储、命令层的单元测试（含真实 selftest 集成测试）
      - name: Cargo test (workspace)
        run: cargo test --workspace

      # 门禁 3：Tauri 应用本体能否编译
      - name: Cargo check (app)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # 门禁 4：前端类型检查与构建
      - name: Frontend typecheck + build
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vite build
