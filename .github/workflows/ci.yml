name: ci

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['app/**']

defaults:
  run:
    working-directory: app

jobs:
  windows:
    # 必须在 Windows 上跑：MSVC 工具链、i686 目标与 Tauri 都只有 Windows 能验
    runs-on: windows-latest
    steps:
      # 硬件层是独立仓库（rc-device-sdk），以 submodule 挂在 app/src-tauri/vendor/rc-device
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # 若该仓库是私有的，加一个 PAT：secrets.HARDWARE_REPO_TOKEN
          # token: ${{ secrets.HARDWARE_REPO_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          # sidecar 必须 32 位：LC32RFRW.dll 只有 x86 版本
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            app/src-tauri/vendor/rc-device

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 门禁 1：手动构建硬件层（与 AGENTS.md §2 的四步一致，不依赖任何仓库内脚本）
      - name: Build device layer (32-bit sidecar + driver)
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/vendor/rc-device/Cargo.toml `
            --bin rc-device-sidecar --release --target i686-pc-windows-msvc `
            --target-dir src-tauri/target/sidecar
          if ($LASTEXITCODE -ne 0) { throw "cargo build 失败" }

          $out = "src-tauri/resources/device"
          New-Item -ItemType Directory -Force -Path "$out/drivers/LC2000" | Out-Null
          Copy-Item "src-tauri/target/sidecar/i686-pc-windows-msvc/release/rc-device-sidecar.exe" $out -Force
          Copy-Item "src-tauri/vendor/rc-device/drivers/LC2000/*" "$out/drivers/LC2000/" -Recurse -Force

      # 门禁 2：46 项黄金向量（--sim 不加载驱动；selftest 本来就是纯计算）
      - name: Selftest gate (46 golden vectors)
        shell: pwsh
        run: |
          $requests = @('{"id":1,"op":"selftest"}', '{"id":2,"op":"shutdown"}')
          $lines = $requests | & "src-tauri/resources/device/rc-device-sidecar.exe" --sim
          $line = $lines | Where-Object { $_.Trim() } | Select-Object -First 1
          if (-not $line) { throw "sidecar 没有输出" }
          $resp = $line | ConvertFrom-Json
          if (-not $resp.ok -or $resp.result.failed -ne 0 -or $resp.result.passed -ne 46) {
            throw "selftest 未通过：passed=$($resp.result.passed) failed=$($resp.result.failed)"
          }
          "46 通过 / 0 失败"

      # 门禁 3：硬件层自身测试（201 单测 + 契约 + sidecar 协议）
      - name: Cargo test (hardware layer)
        run: cargo test --manifest-path src-tauri/vendor/rc-device/Cargo.toml

      # 门禁 3：产品 workspace（含真起 sidecar --sim 的端到端测试）
      - name: Cargo test (workspace)
        run: cargo test --workspace

      # 门禁 4：Tauri 应用本体能否编译
      - name: Cargo check (app)
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # 门禁 5：前端类型检查与构建
      - name: Frontend typecheck + build
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vite build
