; PMSLockSDK / PMSLockCard 运行配置
; 相对路径以本文件所在目录（sdk\）为基准

[Reader]
; 驱动目录（内含 LC32RFRW.dll）—— 已随包附带，无需安装原软件
DriverDir=IOServer\LC2000
; 串口索引：0=COM1, 1=COM2, ... 6=COM7（驱动内部按 port+1 打开）
Port=6
Baud=9600
; TEMIC 卡写密码（原厂固定 12000206）
Password=12000206

[Card]
; 【已废弃 2026-11-08】SDK 不再读 StartCardNo —— 卡号由产品侧（app 的 cardno.rs）维护 CardNo.state。
; 保留此行只为兼容旧版工具，改动它不会再影响发卡。
StartCardNo=2403

[Files]
; 房号 ↔ 卡内序号
RoomIndex=RoomIndex.ini
; 【已废弃 2026-11-08】SDK 不再读写 CardNo.state；文件本身仍由产品侧使用
CardNoState=CardNo.state
